<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>من هو الغبن؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --ink:#17140f; --btn:#ff3b30; --btn-ink:#fff; --btn-shadow:#8f1410; --frame:#000;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000; --ink:#f5f0e6; --btn:#ffd60a; --btn-ink:#1a1300; --btn-shadow:#8a6f00; --frame:#000; }
}
:root[data-theme="dark"]{ --bg:#000; --ink:#f5f0e6; --btn:#ffd60a; --btn-ink:#1a1300; --btn-shadow:#8a6f00; --frame:#000; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Lalezar","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  display:flex; align-items:center; justify-content:center; text-align:center;
  overflow-x:hidden;
}
main{width:100%; max-width:560px; padding:20px; display:flex; flex-direction:column; align-items:center; gap:22px}
.hint{font-size:1.1rem; opacity:.7; margin:0}
button{font:inherit; cursor:pointer; border:0}
#ask{
  background:var(--btn); color:var(--btn-ink);
  font-size:clamp(1.6rem,7vw,2.4rem); line-height:1.25;
  padding:22px 34px; border-radius:22px;
  box-shadow:0 8px 0 var(--btn-shadow);
  transform:rotate(-2deg);
  animation:wobble 1.6s ease-in-out infinite;
  transition:box-shadow .08s, translate .08s;
  max-width:100%;
}
#ask:active{box-shadow:0 2px 0 var(--btn-shadow); translate:0 6px}
#ask:focus-visible,#back:focus-visible{outline:4px solid var(--ink); outline-offset:4px}
@keyframes wobble{
  0%,100%{transform:rotate(-2deg) scale(1)}
  50%{transform:rotate(2deg) scale(1.06)}
}
#reveal{display:none; flex-direction:column; align-items:center; gap:18px; width:100%}
#reveal.show{display:flex}
#stage{
  position:relative; width:100%; aspect-ratio:1048/1120; background:var(--frame); border-radius:18px;
  margin-bottom:clamp(90px,22vw,120px);
  animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;
}
#stage img{display:block; width:100%; height:100%; border-radius:18px}
#stage #fg{
  position:absolute; left:36.260%; top:58.214%; width:34.351%; height:40.000%;
  border-radius:0; mix-blend-mode:screen; z-index:2; transform-origin:50% 50%;
}
#stage #glasses{
  position:absolute; left:36.260%; top:58.214%; width:34.351%; height:40.000%;
  z-index:3; pointer-events:none; transform-origin:50% 50%; overflow:visible;
}
#reveal.show #fg,#reveal.show #glasses{animation:comeAtYou 5s 1s cubic-bezier(.45,0,.55,1) both}
@keyframes comeAtYou{
  0%{transform:scale(1) rotate(0)}
  10%{transform:scale(1.06) rotate(-2deg)}
  22%{transform:scale(1.22) rotate(3deg)}
  36%{transform:scale(1.42) rotate(-4deg)}
  50%{transform:scale(1.62) rotate(5deg)}
  64%{transform:scale(1.82) rotate(-6deg)}
  78%{transform:scale(2.05) rotate(7deg)}
  88%{transform:scale(2.3) rotate(-4deg)}
  95%{transform:scale(2.1) rotate(2deg)}
  100%{transform:scale(2.2) rotate(0)}
}
@keyframes pop{0%{opacity:0; transform:scale(.4) rotate(-6deg)} 100%{opacity:1; transform:none}}
#back{
  position:relative; z-index:3; background:transparent; color:var(--ink); font-size:1.2rem;
  padding:10px 22px; border-radius:14px; border:2px solid currentColor; opacity:.8;
}
body.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){
  #ask,#stage,#reveal.show #fg,#reveal.show #glasses,body.shake{animation:none}
}
</style>
</head>
